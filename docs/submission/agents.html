<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kickstream match agents and narration</title>
<style>
  html, body { margin: 0; padding: 0; background: #F4F7FB; width: 2560px; height: 1440px; overflow: hidden; }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1440" viewBox="0 0 2560 1440">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#0078D4"/>
    </marker>
    <marker id="arrw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#FFFFFF"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#0E7A3D"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="2560" height="1440" rx="0" fill="#F4F7FB" stroke="none" stroke-width="0"/>
  <rect x="0" y="0" width="2560" height="78" rx="0" fill="#0B3A67" stroke="none" stroke-width="0"/>
  <rect x="24" y="18" width="22" height="22" rx="4" fill="#0078D4" stroke="none" stroke-width="0"/>
  <rect x="24" y="46" width="22" height="8" rx="2" fill="#50E6FF" stroke="none" stroke-width="0"/>
  <text x="56" y="38" text-anchor="start" font-family="Segoe UI, Segoe UI Variable, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">Kickstream</text>
  <text x="56" y="62" text-anchor="start" font-family="Segoe UI, Segoe UI Variable, sans-serif" font-size="16" font-weight="400" fill="#C5DDF5">Football live broadcast</text>
  <text x="2532" y="38" text-anchor="end" font-family="Segoe UI, Segoe UI Variable, sans-serif" font-size="30" font-weight="700" fill="#FFFFFF">Match agents and narration</text>
  <text x="2532" y="62" text-anchor="end" font-family="Segoe UI, Segoe UI Variable, sans-serif" font-size="16" font-weight="400" fill="#D6E6F5">Three teams, four writers, template fallback</text>
  <rect x="24" y="96" width="816" height="520" rx="12" fill="#E8F3FC" stroke="#0B3A67" stroke-width="2"/>
  <rect x="24" y="96" width="816" height="64" rx="12" fill="#0B3A67" stroke="none" stroke-width="0"/>
  <rect x="24" y="128" width="816" height="32" rx="0" fill="#0B3A67" stroke="none" stroke-width="0"/>
  <text x="44" y="128" text-anchor="start" font-family="Segoe UI, Segoe UI Variable, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">Match Reading</text>
  <text x="44" y="152" text-anchor="start" font-family="Segoe UI, Segoe UI Variable, sans-serif" font-size="16" font-weight="400" fill="#F4F7FB">Reads the event stream</text>
  <rect x="40" y="176" width="784" height="133" rx="12" fill="#FFFFFF" stroke="#D0D7E2" stroke-width="1.5"/>
  <text x="56" y="212" text-anchor="start" font-family="Segoe UI, Segoe UI Variable, sans-serif" font-size="22" font-weight="700" fill="#242424">Event Interpreter</text>
  <text x="776" y="212" text-anchor="end" font-family="Segoe UI, Segoe UI Variable, sans-serif" font-size="16" font-weight="650" fill="#0B3A67">Every detection</text>
  <text x="56" y="248" text-anchor="start" font-family="Segoe UI, Segoe UI Variable, sans-serif" font-size="18" font-weight="400" fill="#3D3D3D">Third, flank, phase of play, possession sequence, and danger.</text>
  <text x="56" y="278" text-anchor="start" font-family="Segoe UI, Segoe UI Variable, sans-serif" font-size="18" font-weight="400" fill="#3D3D3D">The other six agents read this event.</text>
  <rect x="40" y="321" width="784" height="133" rx="12" fill="#FFFFFF" stroke="#D0D7E2" stroke-width="1.5"/>
  <text x="56" y="357" text-anchor="start" font-family="Segoe UI, Segoe UI Variable, sans-serif" font-size="22" font-weight="700" fill="#242424">Tactical Analyst</text>
  <text x="776" y="357" text-anchor="end" font-family="Segoe UI, Segoe UI Variable, sans-serif" font-size="16" font-weight="650" fill="#0B3A67">Once a minute</text>
  <text x="56" y="393" text-anchor="start" font-family="Segoe UI, Segoe UI Variable, sans-serif" font-size="18" font-weight="400" fill="#3D3D3D">Pressure, tempo, field tilt, and patterns such as a high press.</text>
  <text x="56" y="423" text-anchor="start" font-family="Segoe UI, Segoe UI Variable, sans-serif" font-size="18" font-weight="400" fill="#3D3D3D">Adds a control fact or a chaos fact when the swing says so.</text>
  <rect x="40" y="467" width="784" height="133" rx="12" fill="#FFFFFF" stroke="#D0D7E2" stroke-width="1.5"/>
  <text x="56" y="503" text-anchor="start" font-family="Segoe UI, Segoe UI Variable, sans-serif" font-size="22" font-weight="700" fill="#242424">Player Tracking Agent</text>
  <text x="776" y="503" text-anchor="end" font-family="Segoe UI, Segoe UI Variable, sans-serif" font-size="16" font-weight="650" fill="#0B3A67">Every player</text>
  <text x="56" y="539" text-anchor="start" font-family="Segoe UI, Segoe UI Variable, sans-serif" font-size="18" font-weight="400" fill="#3D3D3D">Touches, passing, shots, expected goals, rating, and a heat map.</text>
  <text x="56" y="569" text-anchor="start" font-family="Segoe UI, Segoe UI Variable, sans-serif" font-size="18" font-weight="400" fill="#3D3D3D">The page and the player card can follow one player.</text>
  <rect x="864" y="96" width="816" height="520" rx="12" fill="#E7F5EC" stroke="#0E7A3D" stroke-width="2"/>
  <rect x="864" y="96" width="816" height="64" rx="12" fill="#0E7A3D" stroke="none" stroke-width="0"/>
  <rect x="864" y="128" width="816" height="32" rx="0" fill="#0E7A3D" stroke="none" stroke-width="0"/>
  <text x="884" y="128" text-anchor="start" font-family="Segoe UI, Segoe UI Variable, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">Forecast</text>
  <text x="884" y="152" text-anchor="start" font-family="Segoe UI, Segoe UI Variable, sans-serif" font-size="16" font-weight="400" fill="#F4F7FB">Odds and the reason</text>
  <rect x="880" y="176" width="784" height="206" rx="12" fill="#FFFFFF" stroke="#D0D7E2" stroke-width="1.5"/>
  <text x="896" y="212" text-anchor="start" font-family="Segoe UI, Segoe UI Variable, sans-serif" font-size="22" font-weight="700" fill="#242424">Prediction Agent</text>
  <text x="1616" y="212" text-anchor="end" font-family="Segoe UI, Segoe UI Variable, sans-serif" font-size="16" font-weight="650" fill="#0E7A3D">Once a minute</text>
  <text x="896" y="248" text-anchor="start" font-family="Segoe UI, Segoe UI Variable, sans-serif" font-size="18" font-weight="400" fill="#3D3D3D">Win, draw, and loss, a goal in the next ten minutes, and a danger grid.</text>
  <text x="896" y="278" text-anchor="start" font-family="Segoe UI, Segoe UI Variable, sans-serif" font-size="18" font-weight="400" fill="#3D3D3D">Also names what the side on the ball does next.</text>
  <text x="896" y="354" text-anchor="start" font-family="Segoe UI, Segoe UI Variable, sans-serif" font-size="16" font-weight="650" fill="#0E7A3D">Publishes onto the match stream</text>
  <rect x="880" y="394" width="784" height="206" rx="12" fill="#FFFFFF" stroke="#D0D7E2" stroke-width="1.5"/>
  <text x="896" y="430" text-anchor="start" font-family="Segoe UI, Segoe UI Variable, sans-serif" font-size="22" font-weight="700" fill="#242424">Explainability Agent</text>
  <text x="1616" y="430" text-anchor="end" font-family="Segoe UI, Segoe UI Variable, sans-serif" font-size="16" font-weight="650" fill="#0E7A3D">When it matters</text>
  <text x="896" y="466" text-anchor="start" font-family="Segoe UI, Segoe UI Variable, sans-serif" font-size="18" font-weight="400" fill="#3D3D3D">Writes why this matters, in Fan and Analyst wording. English prose.</text>
  <text x="896" y="496" text-anchor="start" font-family="Segoe UI, Segoe UI Variable, sans-serif" font-size="18" font-weight="400" fill="#3D3D3D">At most 20 explanations. A template when no model is set.</text>
  <text x="896" y="572" text-anchor="start" font-family="Segoe UI, Segoe UI Variable, sans-serif" font-size="16" font-weight="650" fill="#0E7A3D">Publishes onto the match stream</text>
  <rect x="1704" y="96" width="816" height="520" rx="12" fill="#FFF1E5" stroke="#A74109" stroke-width="2"/>
  <rect x="1704" y="96" width="816" height="64" rx="12" fill="#A74109" stroke="none" stroke-width="0"/>
  <rect x="1704" y="128" width="816" height="32" rx="0" fill="#A74109" stroke="none" stroke-width="0"/>
  <text x="1724" y="128" text-anchor="start" font-family="Segoe UI, Segoe UI Variable, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">Story</text>
  <text x="1724" y="152" text-anchor="start" font-family="Segoe UI, Segoe UI Variable, sans-serif" font-size="16" font-weight="400" fill="#F4F7FB">Picture and moments</text>
  <rect x="1720" y="176" width="784" height="206" rx="12" fill="#FFFFFF" stroke="#D0D7E2" stroke-width="1.5"/>
  <text x="1736" y="212" text-anchor="start" font-family="Segoe UI, Segoe UI Variable, sans-serif" font-size="22" font-weight="700" fill="#242424">Visualization Agent</text>
  <text x="2456" y="212" text-anchor="end" font-family="Segoe UI, Segoe UI Variable, sans-serif" font-size="16" font-weight="650" fill="#A74109">The 3D pitch</text>
  <text x="1736" y="248" text-anchor="start" font-family="Segoe UI, Segoe UI Variable, sans-serif" font-size="18" font-weight="400" fill="#3D3D3D">Ball flight, players, danger columns, pass lanes, and a camera hint.</text>
  <text x="1736" y="278" text-anchor="start" font-family="Segoe UI, Segoe UI Variable, sans-serif" font-size="18" font-weight="400" fill="#3D3D3D">Only the ball and the player on it are known positions.</text>
  <text x="1736" y="354" text-anchor="start" font-family="Segoe UI, Segoe UI Variable, sans-serif" font-size="16" font-weight="650" fill="#A74109">Publishes onto the match stream</text>
  <rect x="1720" y="394" width="784" height="206" rx="12" fill="#FFFFFF" stroke="#D0D7E2" stroke-width="1.5"/>
  <text x="1736" y="430" text-anchor="start" font-family="Segoe UI, Segoe UI Variable, sans-serif" font-size="22" font-weight="700" fill="#242424">Highlights Agent</text>
  <text x="2456" y="430" text-anchor="end" font-family="Segoe UI, Segoe UI Variable, sans-serif" font-size="16" font-weight="650" fill="#A74109">Key moments</text>
  <text x="1736" y="466" text-anchor="start" font-family="Segoe UI, Segoe UI Variable, sans-serif" font-size="18" font-weight="400" fill="#3D3D3D">Ranks them, and finds long moves, saves, and unsung players.</text>
  <text x="1736" y="496" text-anchor="start" font-family="Segoe UI, Segoe UI Variable, sans-serif" font-size="18" font-weight="400" fill="#3D3D3D">Hidden events include a tactical foul and a ball won high.</text>
  <text x="1736" y="572" text-anchor="start" font-family="Segoe UI, Segoe UI Variable, sans-serif" font-size="16" font-weight="650" fill="#A74109">Publishes onto the match stream</text>
  <rect x="24" y="632" width="2512" height="300" rx="12" fill="#F8F2FC" stroke="#5C2D91" stroke-width="2"/>
  <text x="44" y="668" text-anchor="start" font-family="Segoe UI, Segoe UI Variable, sans-serif" font-size="24" font-weight="700" fill="#5C2D91">Four narration writers</text>
  <text x="44" y="698" text-anchor="start" font-family="Segoe UI, Segoe UI Variable, sans-serif" font-size="18" font-weight="400" fill="#3D3D3D">Microsoft Agent Framework. One shared Foundry client. Each item is written once per mode and language.</text>
  <rect x="44" y="720" width="596" height="184" rx="12" fill="#FFFFFF" stroke="#D0D7E2" stroke-width="1.5"/>
  <text x="64" y="760" text-anchor="start" font-family="Segoe UI, Segoe UI Variable, sans-serif" font-size="22" font-weight="700" fill="#5C2D91">Commentator</text>
  <text x="64" y="792" text-anchor="start" font-family="Segoe UI, Segoe UI Variable, sans-serif" font-size="16" font-weight="650" fill="#0B3A67">Key moment</text>
  <text x="64" y="832" text-anchor="start" font-family="Segoe UI, Segoe UI Variable, sans-serif" font-size="18" font-weight="400" fill="#3D3D3D">Fan wording, beside the analyst writer.</text>
  <rect x="664" y="720" width="596" height="184" rx="12" fill="#FFFFFF" stroke="#D0D7E2" stroke-width="1.5"/>
  <text x="684" y="760" text-anchor="start" font-family="Segoe UI, Segoe UI Variable, sans-serif" font-size="22" font-weight="700" fill="#5C2D91">Tactical Analyst</text>
  <text x="684" y="792" text-anchor="start" font-family="Segoe UI, Segoe UI Variable, sans-serif" font-size="16" font-weight="650" fill="#0B3A67">Key moment</text>
  <text x="684" y="832" text-anchor="start" font-family="Segoe UI, Segoe UI Variable, sans-serif" font-size="18" font-weight="400" fill="#3D3D3D">Analyst wording. Not the match agent.</text>
  <rect x="1284" y="720" width="596" height="184" rx="12" fill="#FFFFFF" stroke="#D0D7E2" stroke-width="1.5"/>
  <text x="1304" y="760" text-anchor="start" font-family="Segoe UI, Segoe UI Variable, sans-serif" font-size="22" font-weight="700" fill="#5C2D91">Recap Writer</text>
  <text x="1304" y="792" text-anchor="start" font-family="Segoe UI, Segoe UI Variable, sans-serif" font-size="16" font-weight="650" fill="#0B3A67">Half and full time</text>
  <text x="1304" y="832" text-anchor="start" font-family="Segoe UI, Segoe UI Variable, sans-serif" font-size="18" font-weight="400" fill="#3D3D3D">The break and the final recap.</text>
  <rect x="1904" y="720" width="596" height="184" rx="12" fill="#FFFFFF" stroke="#D0D7E2" stroke-width="1.5"/>
  <text x="1924" y="760" text-anchor="start" font-family="Segoe UI, Segoe UI Variable, sans-serif" font-size="22" font-weight="700" fill="#5C2D91">Localizer</text>
  <text x="1924" y="792" text-anchor="start" font-family="Segoe UI, Segoe UI Variable, sans-serif" font-size="16" font-weight="650" fill="#0B3A67">Spanish and Hindi</text>
  <text x="1924" y="832" text-anchor="start" font-family="Segoe UI, Segoe UI Variable, sans-serif" font-size="18" font-weight="400" fill="#3D3D3D">Translates each item. Cost stays flat.</text>
  <rect x="24" y="952" width="1232" height="436" rx="12" fill="#FFF8E6" stroke="#8A6116" stroke-width="2"/>
  <text x="48" y="996" text-anchor="start" font-family="Segoe UI, Segoe UI Variable, sans-serif" font-size="26" font-weight="700" fill="#8A6116">No model is set</text>
  <text x="48" y="1044" text-anchor="start" font-family="Segoe UI, Segoe UI Variable, sans-serif" font-size="22" font-weight="400" fill="#242424">Template fallback.</text>
  <text x="48" y="1080" text-anchor="start" font-family="Segoe UI, Segoe UI Variable, sans-serif" font-size="22" font-weight="400" fill="#242424">The line is marked Scripted.</text>
  <text x="48" y="1116" text-anchor="start" font-family="Segoe UI, Segoe UI Variable, sans-serif" font-size="22" font-weight="400" fill="#242424">Foundry project endpoint is empty,</text>
  <text x="48" y="1152" text-anchor="start" font-family="Segoe UI, Segoe UI Variable, sans-serif" font-size="22" font-weight="400" fill="#242424">and KICKSTREAM_LLM_* is empty.</text>
  <text x="48" y="1188" text-anchor="start" font-family="Segoe UI, Segoe UI Variable, sans-serif" font-size="22" font-weight="400" fill="#242424">The seven agents still compute.</text>
  <text x="48" y="1224" text-anchor="start" font-family="Segoe UI, Segoe UI Variable, sans-serif" font-size="22" font-weight="400" fill="#242424">Only the wording waits.</text>
  <text x="48" y="1260" text-anchor="start" font-family="Segoe UI, Segoe UI Variable, sans-serif" font-size="22" font-weight="400" fill="#242424">Custom instructions wait too.</text>
  <text x="48" y="1296" text-anchor="start" font-family="Segoe UI, Segoe UI Variable, sans-serif" font-size="22" font-weight="400" fill="#242424">Switched-off agents stay off.</text>
  <rect x="1280" y="952" width="1256" height="436" rx="12" fill="#E8F3FC" stroke="#0078D4" stroke-width="2"/>
  <image href="icons/foundry-project.svg" x="1304" y="976" width="40" height="40"></image>
  <text x="1356" y="1004" text-anchor="start" font-family="Segoe UI, Segoe UI Variable, sans-serif" font-size="26" font-weight="700" fill="#0B3A67">A model is set</text>
  <text x="1304" y="1060" text-anchor="start" font-family="Segoe UI, Segoe UI Variable, sans-serif" font-size="22" font-weight="400" fill="#242424">Microsoft Agent Framework writes.</text>
  <text x="1304" y="1096" text-anchor="start" font-family="Segoe UI, Segoe UI Variable, sans-serif" font-size="22" font-weight="400" fill="#242424">A Foundry project is preferred when</text>
  <text x="1304" y="1132" text-anchor="start" font-family="Segoe UI, Segoe UI Variable, sans-serif" font-size="22" font-weight="400" fill="#242424">both it and KICKSTREAM_LLM_* are set.</text>
  <text x="1304" y="1168" text-anchor="start" font-family="Segoe UI, Segoe UI Variable, sans-serif" font-size="22" font-weight="400" fill="#242424">The app signs in with Entra ID.</text>
  <text x="1304" y="1204" text-anchor="start" font-family="Segoe UI, Segoe UI Variable, sans-serif" font-size="22" font-weight="400" fill="#242424">Slow, limited, or unusable output</text>
  <text x="1304" y="1240" text-anchor="start" font-family="Segoe UI, Segoe UI Variable, sans-serif" font-size="22" font-weight="400" fill="#242424">falls back to the template.</text>
  <text x="1304" y="1276" text-anchor="start" font-family="Segoe UI, Segoe UI Variable, sans-serif" font-size="22" font-weight="400" fill="#242424">A replay is cached, so it is free.</text>
  <text x="1304" y="1312" text-anchor="start" font-family="Segoe UI, Segoe UI Variable, sans-serif" font-size="22" font-weight="400" fill="#242424">Explainability stops at 20 lines.</text>
  <rect x="0" y="1406" width="2560" height="34" rx="0" fill="#0B3A67" stroke="none" stroke-width="0"/>
  <text x="24" y="1428" text-anchor="start" font-family="Segoe UI, Segoe UI Variable, sans-serif" font-size="16" font-weight="400" fill="#E5F0FA">Explainability Agent is the only match agent that writes prose: English, at most 20 explanations a match.</text>
  <text x="2532" y="1428" text-anchor="end" font-family="Segoe UI, Segoe UI Variable, sans-serif" font-size="16" font-weight="400" fill="#E5F0FA">Kickstream submission</text>
</svg>
</body>
</html>

  <text x="596" y="606" text-anchor="start" font-family="Segoe UI, Segoe UI Variable, sans-serif" font-size="20" font-weight="700" fill="#5C2D91">Seven match agents publish onto this stream</text>
  <text x="596" y="638" text-anchor="start" font-family="Segoe UI, Segoe UI Variable, sans-serif" font-size="16" font-weight="400" fill="#3D3D3D">Match Reading: Event Interpreter, Tactical Analyst, Player Tracking Agent.</text>
  <text x="596" y="662" text-anchor="start" font-family="Segoe UI, Segoe UI Variable, sans-serif" font-size="16" font-weight="400" fill="#3D3D3D">Forecast: Prediction Agent, Explainability Agent. Story: Visualization Agent, Highlights Agent.</text>
  <text x="596" y="700" text-anchor="start" font-family="Segoe UI, Segoe UI Variable, sans-serif" font-size="16" font-weight="400" fill="#3D3D3D">Findings join the same stream the gateway sends to the browser.</text>

  <text x="1150" y="810" text-anchor="start" font-family="Segoe UI, Segoe UI Variable, sans-serif" font-size="18" font-weight="400" fill="#3D3D3D">Encodes that picture once.</text>

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    name: Pipeline (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/pipeline
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Contracts match the schema
        run: |
          uv run python -m kickstream.tools.gen_contracts
          git diff --exit-code -- kickstream/contracts.py
      # Ubuntu's AppArmor stops unprivileged user namespaces, which the browser's sandbox needs.
      # The capture tests run a real browser, and it must keep its sandbox, as it does in production.
      - name: Let the browser sandbox start
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # A browser's first launch on a fresh runner builds its caches and can outlast a capture's start
      # deadline. Launch the one the tests use once, with a generous limit, so the tests time a warm start.
      - name: Warm up the browser
        run: |
          browser=$(uv run python -c "from kickstream.adapters.chromium_capture import find_browser; print(find_browser(None) or '')")
          if [ -n "$browser" ]; then
            echo "Warming up $browser"
            time timeout 120 "$browser" --headless=new --no-first-run --user-data-dir="$(mktemp -d)" --dump-dom about:blank > /dev/null
          fi
      - name: Test
        run: uv run pytest -q

  web:
    name: Web (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Contracts match the schema
        run: |
          pnpm gen:contracts
          git diff --exit-code -- src/contracts.ts
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm exec vite build

  terraform:
    name: Infrastructure (Terraform)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/terraform
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
